# configs/baseline_transfer_learning.yaml
# Phase 4 baseline: single-image ResNet18 transfer learning.
# Single image (left only), no stereo, no enhancement, no text guidance.
# Uses ResNet18 backbone for architectural consistency as a standard baseline.

_base_: base.yaml   # conceptual inheritance; loader merges with base defaults

model:
  backbone: resnet18             # standard baseline; architecturally consistent reference
  pretrained: true
  num_classes: 17                # 16 gesture classes (IDs 0–15) + true_neg (ID 16)
  stereo:
    enabled: false               # single-image baseline — no right branch
  text_guidance:
    enabled: false               # no text guidance — plain linear classifier head

data:
  image_size: 224
  enhancement_method: none       # raw images only, matching Yang et al. setup
  split_train: ./data/processed/splits/standard_train.csv
  split_val:   ./data/processed/splits/standard_val.csv
  split_test:  ./data/processed/splits/standard_test.csv
  use_left_only: true            # explicitly use only left image

training:
  epochs: 20
  batch_size: 32
  base_lr: 1.0e-3
  loss:
    alpha: 1.0                   # CE only (no contrastive term for baseline)
    beta: 0.0
  # Simpler schedule: no progressive unfreezing for the baseline
  phases:
    phase1:
      epochs: [1, 5]
      freeze_backbone: true
      lr_scale: 1.0
    phase2:
      epochs: [6, 20]
      freeze_backbone: false
      unfreeze_last_n_blocks: null
      lr_scale: 0.1
