# configs/sense_neither.yaml
# Phase 10 P10.6 backbone-matched control: EfficientNet-B4 pipeline with all
# three SENSE contributions disabled — no enhancement, no stereo, no text guidance.
# Inherits from sense_full.yaml; only stereo, text_guidance, and enhancement_method differ.

_base_: sense_full.yaml

model:
  stereo:
    enabled: false
  text_guidance:
    enabled: false

data:
  enhancement_method: none
